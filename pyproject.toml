[project]
name = "invoice-tool"
version = "0.1.0"
description = "Invoice automation tool with KSeF integration"
requires-python = ">=3.12"
dependencies = [
    "weasyprint>=62.0",
    "Jinja2>=3.1",
    "lxml>=6.1",
    "typer>=0.25",
    "pyyaml>=6.0",
    "qrcode[pil]>=8.0",
    "python-dotenv>=1.0",
    "ksef2>=0.15.0",
]

[project.scripts]
invoice = "src.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
